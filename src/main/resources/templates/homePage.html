<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dagbok hemsida</title>
</head>
<body>
    <h1>Dagboksinlägg</h1>
    <ul>
        <li th:each="dagBok : ${dagBoks}">
            <h3 th:text="${dagBok.rubrik}">Rubrik</h3>
            <p th:text="${dagBok.text}">Text</p>
            <span th:text="${dagBok.datum}">Datum</span><br>
            <a th:href="@{'/edit/' + ${dagBok.id}}">Ändra</a>

        </li>
        
    </ul>
    <a href="/new-dagbok">Gå till Nytt inlägg</a>
</body>
</html>
